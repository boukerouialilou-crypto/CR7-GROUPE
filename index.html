<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Mon Page Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #e2e2e2;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenue sur mon site</h1>
        <p>Une structure de base prête à l'emploi.</p>
    </header>

    <main>
        <div class="card">
            <h2>À propos</h2>
            <p>Ceci est un exemple de page HTML structurée. Tu peux modifier le contenu, ajouter des images ou personnaliser le style CSS dans la section <code>&lt;head&gt;</code>.</p>
            <button onclick="alert('Bonjour !')">Cliquer ici</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Tous droits réservés</p>
    </footer>

</body>
</html>
