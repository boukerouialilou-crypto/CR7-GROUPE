<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Mon Espace d'Études Personnalisé</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3748;
        }
        header {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        header h1 {
            font-size: 2.2rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        section {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h2 {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .sec-1 h2 { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .sec-2 h2 { background: linear-gradient(45deg, #FF8008, #FFC837); }
        .sec-3 h2 { background: linear-gradient(45deg, #8E2DE2, #4A00E0); }

        /* Style des entrées de texte */
        input[type="text"], input[type="date"], textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            border-color: #764ba2;
            outline: none;
            background-color: #f7fafc;
        }

        /* Tableau d'Emploi du Temps */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #4a5568;
            color: white;
            padding: 12px;
            border-radius: 6px 6px 0 0;
        }
        td {
            padding: 8px;
            border: 1px solid #e2e8f0;
            background: white;
        }
        tr:nth-child(even) td {
            background: #f8fafc;
        }
        .jour-label {
            font-weight: bold;
            color: #2b6cb0;
            text-align: center;
        }

        /* Section Devoirs */
        .devoir-card {
            background: #fffaf0;
            border-left: 6px solid #ed8936;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .devoir-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Section Examens */
        .examen-card {
            background: #f3e8ff;
            border-left: 6px solid #9f7aea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mon Carnet d'Études</h1>
        <p>Remplis ton emploi du temps, tes devoirs et tes examens</p>
    </header>

    <div class="container">

        <section class="sec-1">
            <h2>📅 Mon Emploi du Temps (Dimanche à Jeudi)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Jour</th>
                            <th>Matin</th>
                            <th>Après-midi</th>
                            <th>Soir / Révision</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="jour-label">Dimanche</td>
                            <td><input type="text" placeholder="Matières du matin..."></td>
                            <td><input type="text" placeholder="Matières de l'après-midi..."></td>
                            <td><input type="text" placeholder="Révisions..."></td>
                        </tr>
                        <tr>
                            <td class="jour-label">Lundi</td>
                            <td><input type="text" placeholder="Matières du matin..."></td>
                            <td><input type="text" placeholder="Matières de l'après-midi..."></td>
                            <td><input type="text" placeholder="Révisions..."></td>
                        </tr>
                        <tr>
                            <td class="jour-label">Mardi</td>
                            <td><input type="text" placeholder="Matières du matin..."></td>
                            <td><input type="text" placeholder="Matières de l'après-midi..."></td>
                            <td><input type="text" placeholder="Révisions..."></td>
                        </tr>
                        <tr>
                            <td class="jour-label">Mercredi</td>
                            <td><input type="text" placeholder="Matières du matin..."></td>
                            <td><input type="text" placeholder="Matières de l'après-midi..."></td>
                            <td><input type="text" placeholder="Révisions..."></td>
                        </tr>
                        <tr>
                            <td class="jour-label">Jeudi</td>
                            <td><input type="text" placeholder="Matières du matin..."></td>
                            <td><input type="text" placeholder="Matières de l'après-midi..."></td>
                            <td><input type="text" placeholder="Révisions..."></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="sec-2">
            <h2>📝 Mes Devoirs à Faire</h2>
            
            <div class="devoir-card">
                <div class="devoir-grid">
                    <input type="text" placeholder="Matière (ex: Mathématiques)">
                    <input type="date">
                    <select>
                        <option>🔴 À faire</option>
                        <option>🟡 En cours</option>
                        <option>🟢 Terminé</option>
                    </select>
                </div>
                <input type="text" placeholder="Détail du devoir (ex: Exercices 3 et 4 p. 52)">
            </div>

            <div class="devoir-card">
                <div class="devoir-grid">
                    <input type="text" placeholder="Matière (ex: Français)">
                    <input type="date">
                    <select>
                        <option>🔴 À faire</option>
                        <option>🟡 En cours</option>
                        <option>🟢 Terminé</option>
                    </select>
                </div>
                <input type="text" placeholder="Détail du devoir...">
            </div>

            <div class="devoir-card">
                <div class="devoir-grid">
                    <input type="text" placeholder="Matière...">
                    <input type="date">
                    <select>
                        <option>🔴 À faire</option>
                        <option>🟡 En cours</option>
                        <option>🟢 Terminé</option>
                    </select>
                </div>
                <input type="text" placeholder="Détail du devoir...">
            </div>
        </section>

        <section class="sec-3">
            <h2>🎓 Mes Examens & Préparation</h2>
            
            <div class="examen-card">
                <div class="devoir-grid">
                    <input type="text" placeholder="Matière de l'examen">
                    <input type="date">
                </div>
                <textarea placeholder="Comment va être l'examen ? (Chapitres à réviser, type d'exercices, consignes du prof...)"></textarea>
            </div>

            <div class="examen-card">
                <div class="devoir-grid">
                    <input type="text" placeholder="Matière de l'examen">
                    <input type="date">
                </div>
                <textarea placeholder="Comment va être l'examen ? (Chapitres à réviser, type d'exercices, consignes du prof...)"></textarea>
            </div>
        </section>

    </div>

    <footer>
        <p>Mon Organisation Scolaire Personnel</p>
    </footer>

</body>
</html>
