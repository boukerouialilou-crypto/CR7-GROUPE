<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tchat Direct entre Amis</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      height: 85vh;
      background-color: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #334155;
    }

    #login-screen {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #0284c7;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn-join {
      background-color: #10b981;
    }

    .btn-join:hover {
      background-color: #059669;
    }

    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      padding: 16px 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-info h2 {
      font-size: 17px;
      color: #38bdf8;
    }

    .room-info p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background-color: #0284c7;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.received {
      align-self: flex-start;
      background-color: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }

    .message .sender {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .chat-input-area {
      padding: 16px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
    }

    .send-btn {
      width: auto;
      padding: 0 20px;
      flex: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Écran de Connexion -->
    <div id="login-screen">
      <h1 class="title">Tchat Entre Amis</h1>
      <p class="subtitle">Entrez votre pseudo et un nom de salon secret unique que vous partagez avec votre ami.</p>
      
      <div class="input-group">
        <label for="username">Votre Pseudo</label>
        <input type="text" id="username" placeholder="Ex: Salah">
      </div>

      <div class="input-group">
        <label for="room">Nom du Salon (ex: mon-salon-secret)</label>
        <input type="text" id="room" placeholder="Ex: salon-salah-99">
      </div>

      <div class="btn-group">
        <button class="btn" onclick="createRoom()">Créer le Salon</button>
        <button class="btn btn-join" onclick="joinRoom()">Rejoindre</button>
      </div>
    </div>

    <!-- Écran de Discussion -->
    <div id="chat-screen">
      <div class="chat-header">
        <div class="room-info">
          <h2 id="display-room">Salon</h2>
          <p id="room-status">Connexion en cours...</p>
        </div>
        <button class="btn" style="flex:none; width: auto; padding: 6px 12px; font-size: 12px; background-color: #ef4444;" onclick="location.reload()">Quitter</button>
      </div>

      <div class="messages-container" id="messages"></div>

      <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Écrivez votre message..." onkeypress="handleKeyPress(event)">
        <button class="btn send-btn" onclick="sendMessage()">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- PeerJS pour la connexion directe entre navigateurs -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    let peer = null;
    let conn = null;
    let currentUser = "";

    function createRoom() {
      const username = document.getElementById('username').value.trim();
      const room = document.getElementById('room').value.trim().toLowerCase();

      if (!username || !room) {
        alert("Veuillez remplir votre pseudo et le nom du salon !");
        return;
      }

      currentUser = username;
      showChatScreen(room, "Création du salon...");

      // L'hôte crée le salon avec son nom de salon comme identifiant unique
      peer = new Peer("salah-chat-" + room);

      peer.on('open', (id) => {
        document.getElementById('room-status').innerText = "Salon prêt ! En attente de votre ami...";
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert("Ce nom de salon est déjà pris. Essayez un autre nom de salon plus original !");
          location.reload();
        } else {
          alert("Erreur : " + err.type);
        }
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        document.getElementById('room-status').innerText = "Ami connecté ! Vous pouvez discuter.";
      });
    }

    function joinRoom() {
      const username = document.getElementById('username').value.trim();
      const room = document.getElementById('room').value.trim().toLowerCase();

      if (!username || !room) {
        alert("Veuillez remplir votre pseudo et le nom du salon !");
        return;
      }

      currentUser = username;
      showChatScreen(room, "Connexion au salon de votre ami...");

      // L'ami se connecte au salon de l'hôte
      peer = new Peer();

      peer.on('open', (id) => {
        conn = peer.connect("salah-chat-" + room);
        setupConnection();
      });

      peer.on('error', (err) => {
        alert("Impossible de trouver le salon. Vérifiez que votre ami a bien créé le salon en premier !");
        location.reload();
      });
    }

    function setupConnection() {
      document.getElementById('room-status').innerText = "Connecté avec votre ami !";

      conn.on('data', (data) => {
        displayMessage(data.sender, data.text, 'received');
      });

      conn.on('close', () => {
        alert("Votre ami s'est déconnecté.");
        location.reload();
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text) return;

      if (!conn || !conn.open) {
        alert("La connexion avec votre ami n'est pas encore établie ! Attendez qu'il rejoigne.");
        return;
      }

      // Envoyer le message directement à l'ami
      conn.send({
        sender: currentUser,
        text: text
      });

      displayMessage(currentUser, text, 'sent');
      input.value = "";
    }

    function showChatScreen(roomName, statusText) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      document.getElementById('display-room').innerText = "Salon : " + roomName;
      document.getElementById('room-status').innerText = statusText;
    }

    function displayMessage(sender, text, type) {
      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;

      if (type === 'received') {
        const senderDiv = document.createElement('div');
        senderDiv.className = 'sender';
        senderDiv.innerText = sender;
        msgDiv.appendChild(senderDiv);
      }

      const textNode = document.createTextNode(text);
      msgDiv.appendChild(textNode);

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
